name: Windows release v1.1

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.1'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix client
          npm install --no-save --no-package-lock @tauri-apps/cli@2
      - name: Generate Smart Grocer icons
        run: npx tauri icon client/SPaDe_Name3.png
      - name: Build Windows installer
        run: npx tauri build --bundles nsis
      - name: Upload installer as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-grocer-windows-v1.1
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v1.1')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create v1.1 src-tauri/target/release/bundle/nsis/*.exe --title "Smart Grocer v1.1 - SPaDe Corp" --notes "SPaDe theme, address improvements, 10-mile default radius, automatic heuristic item-to-store assignment, and interactive shopping map. Recommendations are based on store category and proximity, not confirmed inventory or prices. Windows installer requires internet for live store discovery." --verify-tag
